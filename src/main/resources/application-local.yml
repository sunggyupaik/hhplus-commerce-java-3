spring:
  data:
    redis:
      host: localhost
      port: 6379
    redisson:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:tcp://localhost/~/test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: never # 서버 시작시 항상 classpath의 sql문을 실행하도록 설정
  #      continue-on-error: true # 서버 시작시 sql문을 실행할 때 오류 무시하고 계속 진행
  #      schema-locations: classpath:sql/schema-postgresql.sql # 서버 시작시 ddl sql문을 실행할 위치 및 파일 지정
  #      data-locations: classpath:sql/data.sql # 서버 시작시 dml sql문을 실행할 위치 및 파일 지정

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

logging:
  level:
    #    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace